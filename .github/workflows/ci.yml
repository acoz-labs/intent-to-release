name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  ci:
    if: ${{ vars.SDLC_ACTIONS_ENABLED == 'true' }}
    name: ci
    runs-on: [self-hosted, trusted-linux-x64]
    steps:
      - uses: actions/checkout@v7
      - name: Validate repository content
        run: bin/ci
